name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ] # Déclenche le script lors d'un push sur main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le code source du dépôt GitHub
    - name: Check out the repo
      uses: actions/checkout@v4

    # 2. Se connecter à Docker Hub en utilisant vos secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Configurer l'outil de build Docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4. Construire l'image et l'envoyer sur Docker Hub
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Remplacez "votre-utilisateur" et "votre-repo" par vos vrais noms Docker Hub
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/votre-repo:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/votre-repo:${{ github.sha }}
